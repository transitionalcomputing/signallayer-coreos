[workspace]
members = ["crates/protocol", "crates/platform-client", "platformd", "corectl", "sessiond", "network-observer", "authd", "crates/remote-state", "remote-worker", "remoted", "console"]
resolver = "2"

[workspace.package]
version = "0.0.2"
edition = "2021"

[workspace.dependencies]
sl-protocol = { path = "crates/protocol" }
sl-platform-client = { path = "crates/platform-client" }
sl-remote-state = { path = "crates/remote-state" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zbus = { version = "5.19", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "time", "sync"] }
libc = "0.2"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
hyper = { version = "1", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio", "service"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
cookie = { version = "0.18", default-features = false }
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash"] }

# Argon2id at the frozen parameters is too slow unoptimized for the unit tests.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
