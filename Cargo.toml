[workspace]
members = ["crates/protocol", "crates/platform-client", "platformd", "corectl", "sessiond", "network-observer", "authd"]
resolver = "2"

[workspace.package]
version = "0.0.2"
edition = "2021"

[workspace.dependencies]
sl-protocol = { path = "crates/protocol" }
sl-platform-client = { path = "crates/platform-client" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zbus = { version = "5.19", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "time", "sync"] }
libc = "0.2"
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash"] }

# Argon2id at the frozen parameters is too slow unoptimized for the unit tests.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
