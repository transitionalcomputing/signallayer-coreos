<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <selinux>
    <associate own="org.signallayer.Platform1"
               context="system_u:system_r:sl_platformd_t:s0"/>
  </selinux>
  <policy context="default">
    <deny own="org.signallayer.Platform1"/>
    <deny send_destination="org.signallayer.Platform1"
          send_path="/org/signallayer/Platform1"
          send_interface="org.signallayer.Platform1" send_member="StartUpdate"/>
    <deny send_destination="org.signallayer.Platform1"
          send_path="/org/signallayer/Platform1"
          send_interface="org.signallayer.Platform1" send_member="StartRollback"/>
    <deny send_destination="org.signallayer.Platform1"
          send_path="/org/signallayer/Platform1"
          send_interface="org.signallayer.Platform1" send_member="StartReboot"/>
    <allow send_destination="org.signallayer.Platform1"
           send_path="/org/signallayer/Platform1"
           send_interface="org.signallayer.Platform1" send_member="GetStatus"/>
  </policy>
  <policy user="root">
    <allow own="org.signallayer.Platform1"/>
    <allow send_destination="org.signallayer.Platform1"
           send_path="/org/signallayer/Platform1"
           send_interface="org.signallayer.Platform1" send_member="StartUpdate"/>
    <allow send_destination="org.signallayer.Platform1"
           send_path="/org/signallayer/Platform1"
           send_interface="org.signallayer.Platform1" send_member="StartRollback"/>
    <allow send_destination="org.signallayer.Platform1"
           send_path="/org/signallayer/Platform1"
           send_interface="org.signallayer.Platform1" send_member="StartReboot"/>
  </policy>
</busconfig>
