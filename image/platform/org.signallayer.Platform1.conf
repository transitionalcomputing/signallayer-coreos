<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy context="default">
    <deny own="org.signallayer.Platform1"/>
    <allow send_destination="org.signallayer.Platform1"
           send_path="/org/signallayer/Platform1"
           send_interface="org.signallayer.Platform1" send_member="GetStatus"/>
  </policy>
  <policy user="root">
    <allow own="org.signallayer.Platform1"/>
  </policy>
</busconfig>
