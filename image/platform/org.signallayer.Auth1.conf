<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- The frozen sl-authd caller matrix (docs/authd-interface-0.0.3.md). -->
<busconfig>
  <selinux>
    <associate own="org.signallayer.Auth1"
               context="system_u:system_r:sl_authd_t:s0"/>
  </selinux>
  <policy context="default">
    <deny own="org.signallayer.Auth1"/>
    <deny send_destination="org.signallayer.Auth1"/>
  </policy>
  <policy user="sl-authd">
    <allow own="org.signallayer.Auth1"/>
  </policy>
  <!-- Web login and pairing. -->
  <policy user="sl-remoted">
    <allow send_destination="org.signallayer.Auth1"
           send_path="/org/signallayer/Auth1"
           send_interface="org.signallayer.Auth1" send_member="VerifyPassword"/>
    <allow send_destination="org.signallayer.Auth1"
           send_path="/org/signallayer/Auth1"
           send_interface="org.signallayer.Auth1" send_member="ConsumePairing"/>
    <allow send_destination="org.signallayer.Auth1"
           send_path="/org/signallayer/Auth1"
           send_interface="org.signallayer.Auth1" send_member="ConfirmRecoveryKey"/>
  </policy>
  <!-- Enrolled-console actions and password recovery. -->
  <policy user="sl-console">
    <allow send_destination="org.signallayer.Auth1"
           send_path="/org/signallayer/Auth1"
           send_interface="org.signallayer.Auth1" send_member="VerifyPassword"/>
    <allow send_destination="org.signallayer.Auth1"
           send_path="/org/signallayer/Auth1"
           send_interface="org.signallayer.Auth1" send_member="RecoverPassword"/>
  </policy>
  <!-- sl-platformd. UID policy admits any root process; see the interface doc. -->
  <policy user="root">
    <allow send_destination="org.signallayer.Auth1"
           send_path="/org/signallayer/Auth1"
           send_interface="org.signallayer.Auth1" send_member="EnsurePendingPairing"/>
    <allow send_destination="org.signallayer.Auth1"
           send_path="/org/signallayer/Auth1"
           send_interface="org.signallayer.Auth1" send_member="CancelPendingPairing"/>
    <allow send_destination="org.signallayer.Auth1"
           send_path="/org/signallayer/Auth1"
           send_interface="org.signallayer.Auth1" send_member="ResetEnrollment"/>
    <allow send_destination="org.signallayer.Auth1"
           send_path="/org/signallayer/Auth1"
           send_interface="org.signallayer.Auth1" send_member="GetPendingPairing"/>
    <allow send_destination="org.signallayer.Auth1"
           send_path="/org/signallayer/Auth1"
           send_interface="org.signallayer.Auth1" send_member="GetEnrollmentState"/>
  </policy>
  <!-- Status schema 0.4 enrolled. -->
  <policy user="sl-sessiond">
    <allow send_destination="org.signallayer.Auth1"
           send_path="/org/signallayer/Auth1"
           send_interface="org.signallayer.Auth1" send_member="GetEnrollmentState"/>
  </policy>
</busconfig>
