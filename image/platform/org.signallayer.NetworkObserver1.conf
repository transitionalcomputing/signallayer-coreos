<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <selinux>
    <associate own="org.signallayer.NetworkObserver1"
               context="system_u:system_r:sl_network_observer_t:s0"/>
  </selinux>
  <policy context="default">
    <deny own="org.signallayer.NetworkObserver1"/>
    <deny send_destination="org.signallayer.NetworkObserver1"/>
    <allow send_destination="org.signallayer.NetworkObserver1"
           send_path="/org/signallayer/NetworkObserver1"
           send_interface="org.signallayer.NetworkObserver1"
           send_member="GetNetworkStatus"/>
  </policy>
  <policy user="sl-network-observer">
    <allow own="org.signallayer.NetworkObserver1"/>
    <deny send_destination="org.freedesktop.NetworkManager"/>
    <allow send_destination="org.freedesktop.NetworkManager"
           send_interface="org.freedesktop.DBus.Properties"
           send_member="Get"/>
  </policy>
</busconfig>
